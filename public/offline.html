<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0a0a0a" />
    <title>Offline · MSR Insight</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        box-sizing: border-box;
        background: #0a0a0a;
        color: #ededed;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        text-align: center;
      }
      main { max-width: 360px; }
      h1 { margin: 0 0 8px; font-size: 20px; }
      p { margin: 0 0 24px; color: #a1a1a1; line-height: 1.5; font-size: 14px; }
      button {
        padding: 10px 20px;
        border: 0;
        border-radius: 8px;
        background: #f97316;
        color: #fff;
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
      button:focus-visible { outline: 2px solid #f97316; outline-offset: 3px; }
    </style>
  </head>
  <body>
    <main>
      <h1>You're offline</h1>
      <p>MSR Insight needs a connection to load your latest attendance and marks. Check your internet and try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
